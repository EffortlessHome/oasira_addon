
name: "Oasira Cloud Bridge"
version: 2.1.2
slug: "oasira_cloud_bridge"
description: "Connects Home Assistant to the Oasira Cloud service and registers connection info"

startup: services
boot: auto
init: false
host_network: true
host_ipc: false
host_pid: false
hassio_api: true
homeassistant_api: true
arch:
  - aarch64
  - amd64
map:
  - "config:rw"
options:
  api_url: ""
  api_endpoint: "careapi"
  enrollment_code: ""
  node_name: ""

schema:
  api_url: str
  api_endpoint: str?
  enrollment_code: str?
  node_name: str?

environment:
  TUNNEL_ORIGIN_CERT: "/cert.pem"
privileged:
  - NET_ADMIN
  - SYS_ADMIN
