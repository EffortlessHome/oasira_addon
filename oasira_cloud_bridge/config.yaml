name: "Oasira Cloud Bridge"
version: 1.2.5
slug: "oasira_bridge"
description: "Connects Home Assistant to the Oasira Cloud WebSocket service and registers connection info"
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:view-dashboard
panel_title: Oasira Dashboard
arch:
  - amd64
  - aarch64
options:
  care_api_url: ""
  enrollment_code: ""
  node_name: ""
  matter_label: "favorite"
  dashboard_port: 8080
schema:
  care_api_url: str
  enrollment_code: str?
  node_name: str?
  matter_label: str?
  dashboard_port: int
environment:
  TUNNEL_ORIGIN_CERT: /cert.pem
